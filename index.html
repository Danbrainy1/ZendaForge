<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zendaforge | We Design. We Build. We Empower.</title>
    
    <!-- Instant Zero-FOUC Theme Initialization Script -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('zendaforge_theme') || localStorage.getItem('webcraft_theme');
          var isDark = saved === 'dark' || (!saved && true);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <meta name="description" content="Zendaforge designs and builds modern, high-performance web applications, digital portals, and software solutions for businesses, schools, and organizations. Powerful Platforms. Real Impact." />
    <meta name="author" content="Zendaforge" />
    <meta name="keywords" content="Zendaforge, web design Nigeria, web application development, school portals, restaurant platforms, hotel management websites, software solutions, Zendaforge digital" />
    
    <!-- Zendaforge Official High-Resolution Favicon Suite (PNG + Multi-Res ICO + Pure Vector SVG + Apple Touch) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=zendaforge" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=zendaforge" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=zendaforge" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon-256.png?v=zendaforge" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=zendaforge" />
    <link rel="shortcut icon" href="/favicon.ico?v=zendaforge" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=zendaforge" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=zendaforge" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Runtime Favicon Enforcement Script -->
    <script>
      (function() {
        try {
          var iconLink = document.querySelector("link[rel*='icon']") || document.createElement('link');
          iconLink.type = 'image/png';
          iconLink.rel = 'shortcut icon';
          iconLink.href = '/favicon-32.png?v=zendaforge';
          document.head.appendChild(iconLink);
        } catch (e) {}
      })();
    </script>

    <!-- Open Graph & Social Sharing Metadata -->
    <meta property="og:site_name" content="Zendaforge" />
    <meta property="og:title" content="Zendaforge | Powerful Websites & Digital Systems" />
    <meta property="og:description" content="We design. We build. We empower. High-performance, modern digital web systems and portals by Zendaforge." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/zendaforge-full-logo.png" />
    <meta property="og:image:width" content="1000" />
    <meta property="og:image:height" content="280" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zendaforge | We Design. We Build. We Empower." />
    <meta name="twitter:description" content="High-performance, modern web systems and digital platforms by Zendaforge." />
    <meta name="twitter:image" content="/zendaforge-full-logo.png" />
    
    <link rel="canonical" href="https://www.zendaforge.com" />
    <meta name="theme-color" content="#070709" />
  </head>

  <body class="bg-white dark:bg-[#070709] text-zinc-900 dark:text-white antialiased selection:bg-[#F5B301] selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
